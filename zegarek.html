<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stary Drewniany Zegar z Kukułką</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&display=swap');

        body {
            font-family: 'Cinzel', serif;
            background: radial-gradient(circle at center, #2c1d11 0%, #120b06 100%);
            color: #e2d1b9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Wood Patterns & Carving Effects */
        .wood-texture {
            background-color: #4a2c11;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px),
                              linear-gradient(to bottom, #5c3818, #3b200a);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.9);
        }

        .wood-dark {
            background: linear-gradient(135deg, #2e1706, #42230c, #1a0b02);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .gold-metal {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Pendulum Animation */
        @keyframes swing {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        .swinging {
            transform-origin: top center;
            animation: swing 2s ease-in-out infinite;
        }

        /* Door Mechanics */
        .door-left, .door-right {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .doors-open .door-left {
            transform: rotateY(-110deg);
        }
        .doors-open .door-right {
            transform: rotateY(110deg);
        }

        /* Mechanical Arm & Bird */
        .cuckoo-mechanism {
            transform: translateY(100px) scale(0);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cuckoo-active .cuckoo-mechanism {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Bird Wing Flap & Bow */
        @keyframes kuku-action {
            0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
            50% { transform: translate(-50%, -8px) rotate(-10deg); }
        }

        @keyframes wing-left {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(35deg); }
        }

        @keyframes wing-right {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-35deg); }
        }

        .bird-singing {
            animation: kuku-action 0.4s ease-in-out infinite;
        }
        .bird-singing .left-wing {
            transform-origin: right center;
            animation: wing-left 0.4s ease-in-out infinite;
        }
        .bird-singing .right-wing {
            transform-origin: left center;
            animation: wing-right 0.4s ease-in-out infinite;
        }

        /* Beak animation */
        @keyframes open-beak {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }
        .bird-singing .beak-bottom {
            transform-origin: top left;
            animation: open-beak 0.4s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 sm:p-6 select-none">

    <!-- Header / Title -->
    <header class="text-center my-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-amber-200 drop-shadow-md">
            Tradycyjny Zegar z Kukułką
        </h1>
        <p class="text-xs sm:text-sm text-amber-400/80 mt-1 italic">Stylizowany zegar mechaniczny z XX wieku</p>

            <!-- Carved Wooden Leaves Decoration Side Panels -->

                    <!-- Left Door -->

                    <!-- Right Door -->
                    <div class="door-right w-1/2 h-full bg-amber-900 border-l border-amber-950 flex items-center justify-start pl-1 shadow-md origin-right">

                    <!-- 5 -->  <span class="absolute bottom-5 right-12">V</span>

                        <path d="M10,20 Q20,30 30,20 M5,35 Q20,50 35,35 M5,55 Q20,70 35,55 M10,75 Q20,85 30,75" stroke="#2b1704" stroke-width="2" fill="none"/>

    <!-- Control Panel -->
    <footer class="w-full max-w-xl bg-amber-950/80 backdrop-blur-md border border-amber-800/50 rounded-2xl p-4 shadow-2xl mt-4 z-40">
        <div class="flex flex-wrap items-center justify-between gap-4">
            
            <!-- Manual Trigger Button -->
            <button id="btnTestCuckoo" class="flex-1 min-w-[140px] px-4 py-2.5 bg-gradient-to-r from-amber-700 to-amber-900 hover:from-amber-600 hover:to-amber-800 text-amber-100 font-bold rounded-xl shadow-lg border border-amber-600/50 active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>Wywołaj Kukułkę</span>
                <span class="text-lg">🐦</span>
            </button>

            <!-- Audio Controls -->
            <div class="flex items-center gap-3 bg-black/40 px-3 py-1.5 rounded-xl border border-amber-900/40">
                <button id="btnMute" class="text-amber-200 hover:text-white transition">
                    <svg id="iconSoundOn" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M17.586 6.414a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
                    </svg>
                    <svg id="iconSoundOff" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                    </svg>
                </button>
                <input id="volumeControl" type="range" min="0" max="1" step="0.05" value="0.7" class="w-20 accent-amber-500 cursor-pointer">
            </div>

            <!-- Time Speed Simulation Toggle -->
            <button id="btnFastForward" class="px-3 py-2 bg-stone-800 hover:bg-stone-700 text-amber-300 rounded-xl text-xs font-semibold border border-amber-900/60 transition">
                Symulacja: <span id="speedStatus">Rzeczywisty</span>
            </button>
        </div>

        <!-- Digital Mirror display info -->
        <div class="mt-3 pt-2 border-t border-amber-900/40 flex justify-between items-center text-xs text-amber-400/70">
            <span>Czas systemowy: <strong id="digitalClock" class="text-amber-200">00:00:00</strong></span>
            <span id="statusText">Czekanie na pełną godzinę...</span>
        </div>
    </footer>

    <!-- Audio & Logic Scripts -->
    <script>
        // Web Audio API Synthesizer for Authentic Cuckoo Sound
        class CuckooAudio {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.volume = 0.7;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSingleKuku() {
                if (this.isMuted) return;
                this.init();

                const now = this.ctx.currentTime;
                
                // Master Volume for this chime
                const masterGain = this.ctx.createGain();
                masterGain.gain.setValueAtTime(this.volume, now);
                masterGain.connect(this.ctx.destination);

                // Note 1: "KU" (Higher Pitch, e.g., F5 ~ 698Hz)
                this.playTone(698, now, 0.18, masterGain);

                // Note 2: "KU" (Lower Pitch, e.g., C5 ~ 523Hz)
                this.playTone(523, now + 0.22, 0.35, masterGain);
            }

            playTone(freq, startTime, duration, destination) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Flute-like warm tone (sine with slight triangle mix)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);
                // Pitch bend slightly down for organic wood pipe acoustics
                osc.frequency.exponentialRampToValueAtTime(freq * 0.96, startTime + duration);

                // Envelope
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.8, startTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(destination);

                osc.start(startTime);
                osc.stop(startTime + duration);
            }

            playMechanicalClick() {
                if (this.isMuted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // Short noise buffer for door opening latch sound
                const bufferSize = this.ctx.sampleRate * 0.05;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3 * this.volume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
            }
        }

        // Main Application Controller
        document.addEventListener('DOMContentLoaded', () => {
            const audio = new CuckooAudio();

            // DOM Elements
            const hourHand = document.getElementById('hourHand');
            const minuteHand = document.getElementById('minuteHand');
            const secondHand = document.getElementById('secondHand');
            const digitalClock = document.getElementById('digitalClock');
            
            const cuckooHouse = document.getElementById('cuckooHouse');
            const birdBody = document.getElementById('birdBody');
            const statusText = document.getElementById('statusText');
            
            const btnTestCuckoo = document.getElementById('btnTestCuckoo');
            const btnMute = document.getElementById('btnMute');
            const iconSoundOn = document.getElementById('iconSoundOn');
            const iconSoundOff = document.getElementById('iconSoundOff');
            const volumeControl = document.getElementById('volumeControl');
            const btnFastForward = document.getElementById('btnFastForward');
            const speedStatus = document.getElementById('speedStatus');

            // State variables
            let isFastForward = false;
            let simulatedTime = new Date();
            let isChiming = false;
            let lastChimedHour = -1;

            // Audio Interaction unlock
            const unlockAudio = () => {
                audio.init();
                document.removeEventListener('click', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);

            // Mute & Volume
            btnMute.addEventListener('click', () => {
                audio.isMuted = !audio.isMuted;
                iconSoundOn.classList.toggle('hidden', audio.isMuted);
                iconSoundOff.classList.toggle('hidden', !audio.isMuted);
            });

            volumeControl.addEventListener('input', (e) => {
                audio.volume = parseFloat(e.target.value);
            });

            // Fast forward simulation toggle
            btnFastForward.addEventListener('click', () => {
                isFastForward = !isFastForward;
                speedStatus.textContent = isFastForward ? 'Przyspieszony (x60)' : 'Rzeczywisty';
                btnFastForward.classList.toggle('bg-amber-700', isFastForward);
                btnFastForward.classList.toggle('text-white', isFastForward);
            });

            // Trigger Full Cuckoo Sequence
            async function triggerCuckooSequence(count) {
                if (isChiming) return;
                isChiming = true;

                statusText.textContent = `Kukułka śpiewa (${count}x)...`;

                // 1. Open doors & mechanical sound
                audio.playMechanicalClick();
                cuckooHouse.classList.add('doors-open');
                
                await sleep(400);

                // 2. Extend bird
                cuckooHouse.classList.add('cuckoo-active');
                await sleep(500);

                // 3. Perform Chimes equal to hour count
                for (let i = 0; i < count; i++) {
                    birdBody.classList.add('bird-singing');
                    audio.playSingleKuku();
                    await sleep(450);
                    birdBody.classList.remove('bird-singing');
                    await sleep(350);
                }

                // 4. Retract bird
                cuckooHouse.classList.remove('cuckoo-active');
                await sleep(500);

                // 5. Close doors
                cuckooHouse.classList.remove('doors-open');
                audio.playMechanicalClick();
                await sleep(400);

                statusText.textContent = 'Czekanie na pełną godzinę...';
                isChiming = false;
            }

            // Manual Test Button Event
            btnTestCuckoo.addEventListener('click', () => {
                const now = getClockTime();
                let hours = now.getHours() % 12;
                hours = hours === 0 ? 12 : hours;
                triggerCuckooSequence(hours);
            });

            // Utility Sleep
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // Get Current Time (Real or Simulated)
            function getClockTime() {
                if (isFastForward) {
                    simulatedTime = new Date(simulatedTime.getTime() + 1000 * 60); // Advance 1 min per tick
                    return simulatedTime;
                } else {
                    simulatedTime = new Date();
                    return simulatedTime;
                }
            }

            // Clock Loop
            function updateClock() {
                const now = getClockTime();

                const seconds = now.getSeconds();
                const minutes = now.getMinutes();
                const hours = now.getHours();

                // Calculate hand rotations
                const secondDeg = (seconds / 60) * 360;
                const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
                const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

                // Apply rotations
                secondHand.style.transform = `translateX(-50%) translateY(-100%) rotate(${secondDeg}deg)`;
                minuteHand.style.transform = `translateX(-50%) translateY(-100%) rotate(${minuteDeg}deg)`;
                hourHand.style.transform = `translateX(-50%) translateY(-100%) rotate(${hourDeg}deg)`;

                // Digital text mirror
                const hh = String(hours).padStart(2, '0');
                const mm = String(minutes).padStart(2, '0');
                const ss = String(seconds).padStart(2, '0');
                digitalClock.textContent = `${hh}:${mm}:${ss}`;

                // Check for Full Hour Trigger (00 minutes and 00 seconds)
                if (minutes === 0 && seconds === 0 && lastChimedHour !== hours) {
                    lastChimedHour = hours;
                    let chimeCount = hours % 12;
                    chimeCount = chimeCount === 0 ? 12 : chimeCount;
                    triggerCuckooSequence(chimeCount);
                }

                // Reset chimed hour guard
                if (minutes !== 0) {
                    lastChimedHour = -1;
                }
            }

            // Run clock update every second (or faster if fast forward)
            setInterval(updateClock, 1000);
            updateClock();
        });
    </script>
